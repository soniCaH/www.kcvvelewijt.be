packages:
  - "apps/*"
  - "packages/*"
  - "scripts/sanity-ops"

# 3 days. A security fix younger than that needs its package listed in
# `minimumReleaseAgeExclude` (same PR), or pnpm refuses to resolve it.
minimumReleaseAge: 4320

overrides:
  # Remove once lockfile maintenance resolves joi >= 17.13.8 on its own, or @storybook/test-runner drops wait-on@7 (#3475).
  "joi@<17.13.8": "17.13.8"
minimumReleaseAgeExclude:
  # Renovate security update: @sanity/ui@4.4.9
  - "@sanity/ui@4.4.9"
  # Renovate security update: pnpm@10.34.7
  - pnpm@10.34.7
  # Renovate security update: @cloudflare/vitest-plugin@1.4.6
  - "@cloudflare/vitest-plugin@1.4.6"
  # Renovate security update: @vitest/coverage-istanbul@4.1.12
  - "@vitest/coverage-istanbul@4.1.12"
  # Renovate security update: vitest@4.1.12
  - vitest@4.1.12
  # Renovate security update: prettier@3.9.10
  - prettier@3.9.10
  # Renovate security update: @testing-library/user-event@14.6.8
  - "@testing-library/user-event@14.6.8"
  # Renovate security update: @vitest/browser@4.1.12
  - "@vitest/browser@4.1.12"
  # Renovate security update: @vitest/browser-playwright@4.1.12
  - "@vitest/browser-playwright@4.1.12"
  # Renovate security update: @vitest/coverage-v8@4.1.12
  - "@vitest/coverage-v8@4.1.12"
  # Renovate security update: @vitest/ui@4.1.12
  - "@vitest/ui@4.1.12"
  # Renovate security update: postcss@8.5.31
  - postcss@8.5.31
  # Renovate security update: vite@8.3.5
  - vite@8.3.5
  # Renovate security update: @commitlint/cli@21.2.4
  - "@commitlint/cli@21.2.4"
  # Renovate security update: @commitlint/config-conventional@21.2.4
  - "@commitlint/config-conventional@21.2.4"
  # Renovate security update: turbo@2.11.10
  - turbo@2.11.10
