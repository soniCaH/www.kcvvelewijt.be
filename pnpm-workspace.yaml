packages:
  - "apps/*"
  - "packages/*"
  - "scripts/sanity-ops"

# 3 days. A security fix younger than that needs its package listed in
# `minimumReleaseAgeExclude` (same PR), or pnpm refuses to resolve it.
minimumReleaseAge: 4320

overrides:
  # Remove once lockfile maintenance resolves joi >= 17.13.8 on its own, or @storybook/test-runner drops wait-on@7 (#3475).
  "joi@<17.13.8": "17.13.8"
minimumReleaseAgeExclude:
  # Renovate security update: @sanity/ui@4.4.9 || 4.4.10
  - "@sanity/ui@4.4.9 || 4.4.10"
  # Renovate security update: pnpm@10.34.7
  - pnpm@10.34.7
  # Renovate security update: sanitize-html@2.18.0
  - sanitize-html@2.18.0
  # Renovate security update: happy-dom@21.0.4
  - happy-dom@21.0.4
  # Renovate security update: storybook@10.6.2
  - storybook@10.6.2
