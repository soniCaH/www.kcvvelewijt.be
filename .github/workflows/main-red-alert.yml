name: Alert on red main

# main's push CI is the last thing that sees a merge commit, and it works: it
# went red on b4179a0e within minutes of the #2761 + #2754 merge race. Nobody
# was told, so a broken lockfile and a dead visual-regression runner sat on main
# for hours and every branch cut from it inherited both (#2874).
#
# Detection was never the gap — notification was. This turns a red run on main
# into a GitHub issue, which is the cheapest thing that reaches a human. It is
# deliberately NOT branch protection: requiring every PR to be up to date would
# re-run the whole pipeline (VR included, ~15 min) on every open PR each time
# anything merges, to prevent something main's own CI already catches.
#
# Note: workflow_run only ever runs the copy of this file on the default branch,
# so this does nothing until it is merged — including on its own PR.

on:
  workflow_run:
    # `E2E` dropped its `push: branches: [main]` trigger in #3151 — it now
    # runs on pull requests only, so it never produces a `workflow_run` event
    # on `main` and has nothing left for this workflow to watch here.
    workflows: ["CI/CD Pipeline"]
    types: [completed]
    branches: [main]

# Only one workflow is watched today (see `on:` above), so only one
# workflow_run event fires per push — but a human re-running a failed run's
# jobs fires a second completed event for the same commit later. A single
# fixed group still serialises that against a concurrent alert run, so it
# reads the issue the first run just opened and comments instead of racing a
# duplicate create.
#
# cancel-in-progress stays false on purpose: cancelling would throw away a real
# failure report, which is the one thing this workflow exists to deliver.
concurrency:
  group: main-red-alert
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  # Read the failed run's jobs and their annotations.
  actions: read
  checks: read

jobs:
  alert:
    name: Open or update the red-main issue
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >-
      github.event.workflow_run.conclusion == 'failure' ||
      github.event.workflow_run.conclusion == 'timed_out'
    steps:
      - name: File the issue
        env:
          # Every value is GitHub-generated or a repo-owned workflow name, and
          # all of it arrives as env rather than `${{ }}` inside the script, so
          # nothing here can be shell-injected. The script also reads test
          # titles from the failed run — free text: keep it out of `${{ }}`.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          WF_NAME: ${{ github.event.workflow_run.name }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          set -euo pipefail

          TITLE="main is red"

          # --force upserts, so this is safe on every run.
          gh label create ci-failure \
            --color B60205 \
            --description "main's own CI is failing" \
            --force >/dev/null

          # One open issue at a time: a second failing workflow on the same
          # broken commit should add a line, not a duplicate issue.
          EXISTING=$(gh issue list --state open --label ci-failure \
            --json number,title \
            --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")

          # What failed, so the incident can be closed with a root cause
          # (#3134). It only reports: nothing here decides flake vs
          # regression — a human does that against the ledger. Every lookup
          # below may fail without stopping the alert itself.
          FAILED_JOBS=$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID/attempts/$RUN_ATTEMPT/jobs?per_page=100" \
            --jq "[.jobs[] | select(.conclusion | IN(\"failure\", \"timed_out\"))]") || FAILED_JOBS='[]'

          JOB_LINES=$(jq -r '.[] | "- \(.name) — failed at: \([(.steps // [])[] | select(.conclusion | IN("failure", "timed_out")) | .name] | join(", ") | if . == "" then "(no step)" else . end)"' <<<"$FAILED_JOBS") || JOB_LINES=""

          # Test names go in code spans, so a title can never @-mention
          # anyone or cross-link an issue. Read from the failed jobs'
          # annotations: Vitest and the VR runner's Jest each title a
          # failed-test annotation with the test's name.
          #
          # A job's id is its check run's id. Actions keeps at most 10 error
          # annotations per step, so a wide failure names only its first.
          # shellcheck disable=SC2016 # the backticks are literal markdown
          TEST_LINES=$(jq -r '.[].id' <<<"$FAILED_JOBS" | while read -r JOB_ID; do
            gh api "repos/$GH_REPO/check-runs/$JOB_ID/annotations?per_page=100" \
              --jq '.[] | select(.annotation_level == "failure" and (.title // "") != "") | .title' || true
          done | sort -u | sed -n '1,30s/.*/- `&`/p') || TEST_LINES=""
          if [ -n "$TEST_LINES" ]; then
            TEST_LINES="$TEST_LINES
          - _(from annotations — Actions keeps 10 per step, so this list may be partial)_"
          fi

          NOTE="\`$WF_NAME\` finished with **$CONCLUSION** on \`main\`.

          - Run: $RUN_URL
          - Commit: \`$HEAD_SHA\`

          **Failed jobs**
          ${JOB_LINES:-- (none reported)}

          **Failed tests**
          ${TEST_LINES:-- none named — read the failed step log}

          Flake or regression is a human call: check the [flake ledger](https://github.com/$GH_REPO/blob/main/docs/research/test-suite-flake-ledger.md), and close with the root cause named."

          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$NOTE"
            echo "Commented on existing issue #$EXISTING"
          else
            gh issue create \
              --title "$TITLE" \
              --label ci-failure \
              --body "$NOTE

          Every branch cut from main inherits this until it is fixed or
          reverted. Close this issue once main is green again."
            echo "Opened a new red-main issue"
          fi
