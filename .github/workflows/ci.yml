name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # ready_for_review is included so marking a draft PR ready triggers CI even
    # without a new push (jobs are draft-gated below).
    types: [opened, synchronize, reopened, ready_for_review]

# Cancel superseded runs on the same ref so repeated pushes to a PR branch don't
# each pay for a full pipeline. Main is exempted (cancel-in-progress: false) so
# in-flight deploy jobs on the default branch are never interrupted mid-deploy.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Turbo Remote Cache — when TURBO_TOKEN (repo secret) + TURBO_TEAM (repo
# variable) are set, `turbo` restores unchanged lint/type-check/test/build
# results from a shared remote cache instead of recomputing them every run and
# every Renovate rebase. Unset = turbo runs normally with no remote cache (no
# failure), so this is safe to commit before the credentials exist. Setup steps
# are in the PR description.
env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  # Docs-only filtering lives HERE, at job level, not on the `on:` triggers.
  # GitHub reports a job skipped by `if:` as Success, but a workflow that never
  # triggered at all leaves its checks permanently "Pending" — so a required
  # check behind `paths-ignore` blocks every docs-only PR forever. Job-level
  # gating keeps the same "don't burn a runner on docs" behaviour while staying
  # safe to mark required (#3084).
  # Same shape and same action as `visual-regression-changes` below.
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # paths-filter reads the PR's file list through the REST API, which the
    # action documents as requiring `pull-requests: read`. It survives on
    # `contents: read` alone today only because this repo is public — the
    # listFiles call would 403 the moment it isn't.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Detect non-docs paths
        id: filter
        uses: dorny/paths-filter@v4.0.3
        with:
          # `every` = a file counts only if it matches ALL patterns, so these
          # two negations together mean "not markdown AND not under docs/".
          # That reproduces the old `paths-ignore: ["**.md", "docs/**"]`
          # exactly. Plain `!` negations need this quantifier: with the default
          # `some`, one negation matching is enough and every docs-only change
          # would still count as code.
          predicate-quantifier: "every"
          filters: |
            code:
              - '!**/*.md'
              - '!docs/**'

  # Quality checks + build merged into one job: `build` previously did its own
  # checkout + install and ran only after this job, so merging removes a whole
  # redundant install cycle per run. Steps fail-fast, so a lint/type/test
  # failure still stops before the (later) build steps — same early-exit as the
  # old two-job split. Draft PRs are skipped to avoid CI on work-in-progress.
  quality-checks:
    name: Quality Checks + Build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [changes]
    if: |
      needs.changes.outputs.code == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    environment: ${{ github.ref == 'refs/heads/main' && 'Production' || 'Preview' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          # `pnpm install` runs lifecycle scripts for the onlyBuiltDependencies
          # allowlist, and the build/test steps execute first-party and
          # third-party code. Checkout persists GITHUB_TOKEN into .git/config by
          # default, where any of that could read it — nothing in this job does a
          # network git operation, so drop it.
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.10
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The Storybook Vitest addon project (#3146,
      # `apps/web/vitest.storybook.config.ts`, its own config file — see its
      # docblock) runs via the separate "Run Storybook play tests" step
      # below (`pnpm run test:storybook`), not through `npx turbo test`, via
      # `@vitest/browser-playwright` — a real Chromium, not happy-dom.
      # `--with-deps` also installs the OS libraries Chromium needs to
      # launch on a bare Ubuntu runner.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: apps/web

      - name: Lint
        run: npx turbo lint --filter=@kcvv/web

      # Pinned to the version `lint:sh` was adopted on, so a runner-image
      # bump cannot turn this red with no repo change.
      - name: Lint shell scripts
        run: |
          curl -fsSL https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz | tar -xJ -C "$RUNNER_TEMP"
          PATH="$RUNNER_TEMP/shellcheck-v0.11.0:$PATH" pnpm run lint:sh

      - name: Unused dependencies (knip)
        run: pnpm run knip

      - name: Type check
        run: npx turbo type-check --filter=@kcvv/web

      # Coverage instrumentation costs ~2.5x the plain run (255s vs 98.6s,
      # #3083) for a Codecov upload that gates nothing (#3100). Pay that only
      # on `main`, where the trend line is read; every PR gets the cheaper
      # run. `turbo` forwards anything after `--` to the underlying `vitest
      # run` script unchanged, so the conditional expression either supplies
      # `-- --coverage` whole or contributes nothing.
      - name: Run tests
        run: npx turbo test --filter=@kcvv/web ${{ github.ref == 'refs/heads/main' && '-- --coverage' || '' }}

      # Separate config, separate invocation, on purpose (#3146, see
      # `apps/web/vitest.storybook.config.ts`'s own docblock): running this
      # project and the one above in the SAME `vitest` process — as a shared
      # `test.projects` array, in one file or across files referenced by
      # string — leaked `process.env.NODE_ENV` and Vite's own SSR resolve
      # `conditions` into the `unit` project, breaking 17 unrelated unit-test
      # files. Not run through `turbo` (no other `test:e2e`-style script is
      # either) — no upstream package build dependency to cache against.
      - name: Run Storybook play tests
        run: pnpm --filter @kcvv/web run test:storybook

      - name: Lint API
        run: npx turbo lint --filter=@kcvv/api

      - name: Type check API
        run: npx turbo type-check --filter=@kcvv/api

      - name: Run API tests
        run: npx turbo test --filter=@kcvv/api

      - name: Run api-contract tests
        run: npx turbo test --filter=@kcvv/api-contract

      - name: Lint + type check Studio
        run: npx turbo lint type-check --filter=@kcvv/studio --filter=@kcvv/sanity-studio

      - name: Run Studio UI tests
        run: npx turbo test --filter=@kcvv/sanity-studio

      - name: Lint + type check + test Sanity ops scripts
        run: npx turbo lint type-check test --filter=@kcvv/sanity-ops

      - name: Build Studio
        run: npx turbo build --filter=@kcvv/studio

      # `@kcvv/web#build` already depends on `@kcvv/studio#typegen` in
      # turbo.json, so the Next.js build below silently regenerates these types
      # every run — but it never compares the result to what's committed, so a
      # schema or GROQ edit that forgot to regenerate just gets quietly
      # rebuilt around (#2862). This step makes that comparison explicit, and
      # runs before the expensive Next.js build so a stale file fails fast.
      # `turbo typegen --filter=@kcvv/studio` reuses the exact task/cache the
      # build depends on, so the later build step gets a cache hit here, not a
      # second run. Needs no Sanity token: `sanity schema extract` reads the
      # local schema code and `sanity typegen generate` reads local GROQ query
      # files — both fully offline.
      - name: Sanity types in sync
        run: |
          npx turbo typegen --filter=@kcvv/studio
          if ! git diff --exit-code -- apps/web/src/lib/sanity/sanity.types.ts; then
            echo "::error::apps/web/src/lib/sanity/sanity.types.ts is out of date. Run 'pnpm --filter @kcvv/studio run typegen' locally and commit the result."
            exit 1
          fi

      # Folded in from the former standalone `security-scan` job — it reuses this
      # job's already-installed dependencies instead of paying for its own
      # checkout + install. Non-blocking (advisory only). Deeper dependency
      # vulnerability scanning is handled by the Snyk GitHub App (the
      # `security/snyk` PR check), which runs on Snyk's infrastructure with no
      # GitHub Actions minutes.
      - name: Audit dependencies (pnpm)
        run: pnpm audit --audit-level=moderate
        continue-on-error: true

      # Only produced by the coverage run above, which is `main`-only (#3138).
      - name: Upload coverage
        if: github.ref == 'refs/heads/main'
        uses: codecov/codecov-action@v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: apps/web/coverage

      - name: Build Next.js
        run: npx turbo build --filter=@kcvv/web
        env:
          KCVV_API_URL: ${{ vars.KCVV_API_URL }}
          NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ vars.NEXT_PUBLIC_SANITY_PROJECT_ID }}
          NEXT_PUBLIC_SANITY_DATASET: ${{ vars.NEXT_PUBLIC_SANITY_DATASET }}
          SANITY_API_READ_TOKEN: ${{ secrets.SANITY_API_READ_TOKEN }}

  # Split out of `quality-checks` (#3138): the build only takes ~37s, but VR
  # used to wait behind the *entire* quality-checks job (~6.6 min median) to
  # reach it. Depending on `changes` alone, this job runs in parallel with
  # quality-checks instead of after it, so `visual-regression` below no longer
  # queues behind lint/type-check/test/build — it now waits on this job only.
  # Trade-off, accepted in #3084: VR runs even when quality-checks fails.
  storybook-build:
    name: Build Storybook
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Also needs `visual-regression-changes`: the same filter that decides
    # whether `visual-regression` runs decides whether it's worth building
    # Storybook at all — an api-only or packages-only push has nothing for VR
    # to look at, so this job (and the runner minute it costs) skips too.
    needs: [changes, visual-regression-changes]
    # Same gates `quality-checks` uses: skip docs-only changes and draft PRs.
    # The repository variable RUN_VISUAL_REGRESSION is the live on/off switch
    # for the whole VR chain (this job, `visual-regression-changes` and
    # `visual-regression`): 'true' runs it, anything else skips it. Flip it
    # under Settings → Secrets and variables → Actions → Variables — no YAML
    # edit needed.
    if: |
      needs.changes.outputs.code == 'true' &&
      needs.visual-regression-changes.outputs.visual == 'true' &&
      vars.RUN_VISUAL_REGRESSION == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    # Checks out the repo and runs first-party build tooling against it; it
    # never needs to write anything.
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.10
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The #3140 single entry point — same script the local Docker wrapper
      # and `vr-baseline-update.yml` use, so a build-step change can't drift
      # between them.
      - name: Build Storybook
        run: pnpm --filter @kcvv/web run vr:build-storybook

      - name: Upload Storybook static
        uses: actions/upload-artifact@v7.0.1
        with:
          name: storybook-static
          path: apps/web/storybook-static
          retention-days: 1
          if-no-files-found: error

  visual-regression-changes:
    name: VR — Detect visual changes
    runs-on: ubuntu-latest
    # Gated on `changes` too: without it this job would newly fire on docs-only
    # PRs, which the old workflow-level paths-ignore used to stop dead.
    #
    # Runs on push too (#3138): the `main` arm used to run VR unconditionally
    # on every push — 23-for-23 green, 21% of spend, zero catches (#3084). This
    # job now filters both event types with the same paths-filter, and
    # `visual-regression` below reads its `visual` output uniformly.
    needs: [changes]
    if: |
      needs.changes.outputs.code == 'true' &&
      vars.RUN_VISUAL_REGRESSION == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    # Reading the diff is all this job does; paths-filter goes through the API
    # on a pull_request event (needing the same `pull-requests: read` as
    # `changes` above) and falls back to a plain git diff against
    # `github.event.before` on a push event, which needs no extra permission.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      visual: ${{ steps.filter.outputs.visual }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Detect visual paths
        id: filter
        uses: dorny/paths-filter@v4.0.3
        with:
          filters: |
            visual:
              - 'apps/web/src/**'
              - 'apps/web/.storybook/**'
              # Fixtures, the frozen-clock/viewport-scoping helpers, and the
              # committed baselines all live here — a change under any of
              # these can change what a story renders or what it's compared
              # against, without touching apps/web/src.
              - 'apps/web/test/**'
              - 'apps/web/public/**'
              - 'apps/web/package.json'
              # The local Docker parity pin — see the `visual-regression`
              # job's container comment. A bump here is a signal the image
              # tag is about to move too.
              - 'apps/web/Dockerfile.vr'
              - '.nvmrc'
              - 'package.json'
              - 'pnpm-workspace.yaml'
              # The VR runner is built out of the lockfile too: a transitive
              # bump can break it without a single source file changing.
              # jest-runtime 30.5.1 killed all 206 suites this way (#2761) —
              # that PR touched only lockfiles, so VR skipped and the break
              # landed on main unseen.
              - 'pnpm-lock.yaml'
              # A change to this workflow (this filter, the shard count, the
              # runner image, …) should verify itself by actually running VR,
              # not skip on the strength of "nothing under apps/web changed".
              - '.github/workflows/ci.yml'

  visual-regression:
    name: Visual Regression (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # `storybook-build`, not `quality-checks` (#3138): VR no longer waits on
    # the whole quality job, and — per #3084's accepted cost — now runs even
    # when lint/type-check/test fails there. A failed or skipped
    # `storybook-build` still skips this job by the default `needs` behaviour.
    needs: [storybook-build, visual-regression-changes]
    # The RUN_VISUAL_REGRESSION repo variable is the live on/off switch for the
    # whole VR chain (this job, `visual-regression-changes` and
    # `storybook-build`) at once. Report-only today: `deploy` does not wait on
    # it and it is not a required check. #3088 decides whether it earns one.
    #
    # Path-filtered uniformly on both push and pull_request now (#3138) — the
    # `main` arm used to run unconditionally (23-for-23 green, zero catches).
    if: vars.RUN_VISUAL_REGRESSION == 'true' && needs.visual-regression-changes.outputs.visual == 'true'
    # 3 shards, not 4 (#3088: #3084 measured the whole pipeline, #3082 measured
    # only the VR job). fail-fast: false so every shard reports its own diffs
    # instead of cancelling siblings on the first red one.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    # Pinned to match @playwright/test in apps/web/package.json (1.60.0) and the
    # local Docker image in apps/web/Dockerfile.vr. Bump all three together —
    # drift produces silent font-rendering diffs.
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
      options: --user 0:0
    # Installs dependencies and drives a browser over the built Storybook; it
    # only ever reads the repo.
    permissions:
      contents: read
    env:
      # The container image already ships browsers under /ms-playwright. Suppress
      # @playwright/test's postinstall re-download to save ~150 MB and ~1 min.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.10
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download Storybook static
        uses: actions/download-artifact@v8.0.1
        with:
          name: storybook-static
          path: apps/web/storybook-static

      # VR_SHARD reaches `test-storybook --shard` through `vr:run`/`vr:ci`
      # (apps/web/package.json) — the one command surface (#3140) stays intact,
      # no raw runner invocation here.
      - name: Run visual regression suite
        run: pnpm --filter @kcvv/web run vr:ci
        env:
          VR_SHARD: ${{ matrix.shard }}/3

      # Distinct name per shard: three parallel jobs would otherwise collide
      # uploading to the same artifact name, and `vr-diff-comment` below
      # gathers all three by pattern.
      - name: Upload diff PNGs on failure
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: vr-diff-output-${{ matrix.shard }}
          path: |
            apps/web/test/vr/__diff_output__/
            apps/web/test/vr/__snapshots__/__received_output__/
          if-no-files-found: ignore
          retention-days: 14

  vr-diff-comment:
    name: VR — Post diff comment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [visual-regression]
    if: failure() && needs.visual-regression.result == 'failure' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false && github.actor != 'dependabot[bot]'
    permissions:
      contents: write
      pull-requests: write
    steps:
      # The orphan-branch push must re-trigger nothing, but the sticky comment
      # has to appear as the CI bot rather than as `github-actions`, so this job
      # runs on a per-run App installation token (see renovate.yml for why).
      - name: Mint an installation token
        id: app-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ vars.KCVV_APP_CLIENT_ID }}
          private-key: ${{ secrets.KCVV_APP_PRIVATE_KEY }}
          # Scoped below what the App grants. `contents` pushes the orphan
          # branch; `pull-requests` + `issues` cover the sticky comment (a PR
          # comment is an issue comment, and which permission the REST call
          # needs depends on the endpoint, so both are granted). Notably NOT
          # `workflows` — nothing here rewrites .github/workflows.
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      # 3 shards upload separately (vr-diff-output-1/2/3); `pattern` +
      # `merge-multiple` flattens all matched artifacts into one directory, so
      # every path below that reads /tmp/vr-diff-output still works unchanged.
      - name: Download diff artifacts
        uses: actions/download-artifact@v8.0.1
        continue-on-error: true
        with:
          pattern: vr-diff-output-*
          path: /tmp/vr-diff-output
          merge-multiple: true

      - name: Push diffs to orphan branch
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          BRANCH="vr-diffs/pr-${PR_NUMBER}"

          # Abort gracefully if no diff PNGs were produced (artifact absent or empty)
          shopt -s nullglob
          diff_pngs=(/tmp/vr-diff-output/__diff_output__/*.png /tmp/vr-diff-output/__snapshots__/__received_output__/*.png)
          if [ ${#diff_pngs[@]} -eq 0 ]; then
            echo "No diff PNGs found — skipping orphan branch push. Original VR failure remains visible."
            exit 0
          fi

          git config user.email "321706059+kcvv-elewijt-ci-bot[bot]@users.noreply.github.com"
          git config user.name "kcvv-elewijt-ci-bot[bot]"

          # Create a detached orphan branch with no history
          git checkout --orphan "$BRANCH"
          git rm -rf . --quiet

          # Copy diff PNGs with prefixes to avoid filename collisions
          mkdir -p vr-diffs
          for f in /tmp/vr-diff-output/__diff_output__/*.png; do
            [ -f "$f" ] && cp "$f" "vr-diffs/diff-$(basename "$f")"
          done
          for f in /tmp/vr-diff-output/__snapshots__/__received_output__/*.png; do
            [ -f "$f" ] && cp "$f" "vr-diffs/actual-$(basename "$f")"
          done

          git add vr-diffs/
          git commit -m "vr: diff snapshots for PR #${PR_NUMBER} [skip ci]"
          git push "https://x-access-token:${TOKEN}@github.com/${REPO}.git" \
            "HEAD:refs/heads/${BRANCH}" --force

      - name: Build comment body
        id: build-comment
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          BRANCH="vr-diffs/pr-${PR_NUMBER}"
          COMMENT="## Visual Regression Diffs\n\n"
          COMMENT+="One or more stories changed. Review before triggering \`@kcvv-bot update-vr-baselines\`.\n\n"

          HAS_DIFFS=false
          shopt -s nullglob
          for diff_file in /tmp/vr-diff-output/__diff_output__/*.png; do
            filename=$(basename "$diff_file")
            story_name="${filename%.png}"
            BASE_URL="https://raw.githubusercontent.com/${REPO}/${BRANCH}/vr-diffs"

            COMMENT+="### ${story_name}\n\n"
            COMMENT+="| Actual | Diff |\n"
            COMMENT+="|--------|------|\n"
            COMMENT+="| ![actual](${BASE_URL}/actual-${filename}) | ![diff](${BASE_URL}/diff-${filename}) |\n\n"
            HAS_DIFFS=true
          done

          echo "has_diffs=${HAS_DIFFS}" >> "$GITHUB_OUTPUT"
          if [ "$HAS_DIFFS" = "true" ]; then
            # Write to file to avoid shell escaping issues
            printf "%b" "$COMMENT" > /tmp/vr-comment.md
            echo "comment_file=/tmp/vr-comment.md" >> "$GITHUB_OUTPUT"
          fi

      - name: Post sticky PR comment
        if: steps.build-comment.outputs.has_diffs == 'true'
        uses: marocchino/sticky-pull-request-comment@v3.0.5
        with:
          header: vr-diff-comment
          path: ${{ steps.build-comment.outputs.comment_file }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

  deploy-api-staging:
    name: Deploy API staging to Cloudflare Workers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quality-checks
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    # Deploys with CLOUDFLARE_API_TOKEN; it never uses GITHUB_TOKEN for more
    # than the checkout itself.
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.10
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build api-contract
        run: npx turbo build --filter=@kcvv/api-contract

      - name: Deploy to Cloudflare Workers (staging)
        run: pnpm --filter @kcvv/api deploy:staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # Combined deploy: API (Cloudflare Workers) + Sanity Studio run as sequential
  # steps in one job instead of two parallel jobs, sharing a single checkout +
  # install. Trade-off: a failed API deploy aborts the job before Studio deploys
  # (previously independent). Acceptable on the main-only deploy path; re-split
  # if independent failure isolation is needed.
  deploy:
    name: Deploy API + Studio
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # `storybook-build` moved out of `quality-checks` (#3138), so without this
    # it would also move out of this deploy gate — a broken story import
    # would merge (quality-checks doesn't build Storybook any more) and
    # deploy. `always()` overrides the default "skip if a need was skipped"
    # behaviour, so the explicit checks below do the gating instead:
    # `storybook-build` may succeed OR skip (RUN_VISUAL_REGRESSION off, or no
    # visual paths touched) but must not have failed.
    needs: [quality-checks, storybook-build]
    if: |
      always() &&
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.quality-checks.result == 'success' &&
      needs.storybook-build.result != 'failure'
    # Same shape as deploy-api-staging, which runs this scope on every PR and
    # deploys for real — the only extra step here is `sanity deploy`, on
    # SANITY_AUTH_TOKEN. Nothing in the job reads GITHUB_TOKEN past checkout.
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.10
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build api-contract
        run: npx turbo build --filter=@kcvv/api-contract

      - name: Deploy API to Cloudflare Workers
        run: pnpm --filter @kcvv/api run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Sanity Studio
        run: pnpm --filter @kcvv/studio run deploy
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
