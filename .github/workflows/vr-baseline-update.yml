name: VR Baseline Update

# Triggered by a maintainer commenting `@kcvv-bot update-vr-baselines` on a PR.
# Re-runs the VR suite with --update-snapshots, commits the regenerated PNGs to
# the PR branch under the CI-bot identity, and pushes — which re-triggers
# the `visual-regression` job to verify the new baselines pass.
#
# Bot identity: the `KCVV Elewijt CI Bot` GitHub App (client id in the repo
#   variable `KCVV_APP_CLIENT_ID`, key in the secret `KCVV_APP_PRIVATE_KEY`). Each run
#   mints its own installation token, valid for an hour. It replaced the
#   PAT-owned machine account `kcvv-vr-bot`, which GitHub suspended on
#   2026-08-27 and took Renovate and every VR job down with it.
#   An App token is also what makes the push below re-trigger CI: the built-in
#   GITHUB_TOKEN deliberately does not, which would leave the new baselines
#   unverified.
#
# Anti-pattern: this workflow MUST NOT use `[skip ci]` — the visual-regression
# job needs to run on the resulting commit to verify the new baselines.

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

jobs:
  trigger-check:
    name: Verify trigger
    if: |
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '@kcvv-bot update-vr-baselines') &&
      github.event.comment.user.login != 'kcvv-elewijt-ci-bot[bot]'
    runs-on: ubuntu-latest
    # Cheap gate (one API call + one reaction). 5 min is generous; anything
    # longer almost certainly means GitHub API itself is degraded.
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Verify PR is from the same repo (no forks)
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.issue.pull_request.url }}
        run: |
          PR_REPO=$(gh api "$PR_URL" --jq '.head.repo.full_name')
          if [ "$PR_REPO" != "${{ github.repository }}" ]; then
            echo "::error::Baseline updates are not supported for fork PRs (PR head: $PR_REPO)."
            exit 1
          fi

      - name: Verify commenter is a maintainer
        env:
          AUTHOR_ASSOC: ${{ github.event.comment.author_association }}
        run: |
          case "$AUTHOR_ASSOC" in
            OWNER|MEMBER|COLLABORATOR) echo "Authorised commenter ($AUTHOR_ASSOC)";;
            *) echo "::error::Only repo maintainers can trigger baseline updates (got $AUTHOR_ASSOC)"; exit 1;;
          esac

      - name: React to comment
        uses: actions/github-script@v9.0.0
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'eyes',
            });

  update-baselines:
    name: Update baselines
    needs: trigger-check
    runs-on: ubuntu-latest
    # Steady-state drift update is ~5 min (storybook build ~30 s, install ~1 min,
    # test-runner with -u ~1 min for a handful of stories, commit/push <30 s).
    # A full from-empty regen (e.g. #1376 reset) captures the entire vr-tagged
    # set over the 3 shard steps below — comparable cost to the
    # `visual-regression` verify job. Each shard step has its own 12 min limit
    # so a genuine hang fails fast; the job limit covers all three plus about
    # 9 min of setup, so a slow shard 3 still hits its own limit, not this one
    # (default GitHub timeout is 6 h, orders of magnitude too long).
    timeout-minutes: 45
    env:
      # What a timed-out shard step leaves behind; shards 2 and 3 kill it.
      VR_LEFTOVERS: "storybook-static|test-storybook|jest-worker|jest-image-snapshot|ms-playwright"
      # All 3 shard steps append the story ids they visit; the step before the
      # commit checks every story was captured (#3275). Inside the container.
      VR_VISITED_LOG: /tmp/vr-visited.txt
    permissions:
      contents: read
      pull-requests: write
    # Same image as the visual-regression job and the local Docker runner.
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --user 0:0
    steps:
      - name: Resolve PR head
        id: pr
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            core.setOutput('ref', pr.data.head.ref);
            core.setOutput('repo', pr.data.head.repo.full_name);
            core.setOutput('sha', pr.data.head.sha);

      - name: Mint an installation token
        id: app-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ vars.KCVV_APP_CLIENT_ID }}
          private-key: ${{ secrets.KCVV_APP_PRIVATE_KEY }}
          # This job only commits baseline PNGs to the PR branch. The comment
          # reactions below run on `github.token`, not this one, so `contents`
          # is the whole requirement.
          permission-contents: write

      - name: Checkout PR branch (pinned to resolved SHA)
        uses: actions/checkout@v7.0.1
        with:
          repository: ${{ steps.pr.outputs.repo }}
          # Pin to the SHA we resolved above instead of the mutable branch ref —
          # if the branch advances between resolution and checkout, we want a
          # deterministic state. The push step still targets the branch ref, so
          # the bot's commit lands on top of whatever the branch HEAD is at
          # push time (git push will fail non-fast-forward if the branch raced
          # ahead, which is the safe outcome).
          ref: ${{ steps.pr.outputs.sha }}
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.10
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Storybook
        run: pnpm --filter @kcvv/web run vr:build-storybook
        env:
          NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ vars.NEXT_PUBLIC_SANITY_PROJECT_ID }}
          NEXT_PUBLIC_SANITY_DATASET: ${{ vars.NEXT_PUBLIC_SANITY_DATASET }}

      - name: Update baselines (1/3)
        # One unsharded process over every story file hung on its last file in
        # four runs in a row, a different file each time (#3270). Three smaller
        # processes, like the verify job, each with its own limit so a hang
        # fails in minutes. Same job, so there is still one commit and push.
        timeout-minutes: 12
        env:
          VR_SHARD: "1/3"
        run: pnpm --filter @kcvv/web run vr:ci:update
      - name: Update baselines (2/3)
        # Run even when an earlier shard failed, so one bot run reports every
        # failing story. The commit step below still needs all three to pass.
        if: ${{ !cancelled() }}
        timeout-minutes: 12
        env:
          VR_SHARD: "2/3"
        run: |
          # A timed-out step only loses its `docker exec`: the shard's server
          # keeps port 6006, and its runner, Jest workers and Chromium keep the
          # CPU (#3272). Exit 1 means nothing was left; the loop waits until
          # the port is free.
          pkill -9 -f "$VR_LEFTOVERS" || [ $? -eq 1 ]
          while pgrep -f "$VR_LEFTOVERS" >/dev/null; do sleep 1; done
          pnpm --filter @kcvv/web run vr:ci:update
      - name: Update baselines (3/3)
        if: ${{ !cancelled() }}
        timeout-minutes: 12
        env:
          VR_SHARD: "3/3"
        run: |
          pkill -9 -f "$VR_LEFTOVERS" || [ $? -eq 1 ]
          while pgrep -f "$VR_LEFTOVERS" >/dev/null; do sleep 1; done
          pnpm --filter @kcvv/web run vr:ci:update

      # A story no shard visited keeps its old baseline and fails the PR's
      # check later, as BioBlock did on #3274 (#3275). Fail here instead.
      - name: Fail unless every story was captured
        run: node apps/web/scripts/vr-coverage.mjs apps/web/storybook-static/index.json "$VR_VISITED_LOG"

      - name: Commit and push baselines
        working-directory: ${{ github.workspace }}
        env:
          BOT_USER: kcvv-elewijt-ci-bot[bot]
          BOT_EMAIL: 321706059+kcvv-elewijt-ci-bot[bot]@users.noreply.github.com
        run: |
          # actions/checkout writes safe.directory under a temp HOME that is
          # discarded after the step — re-register so git accepts the workspace.
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          git config user.name "$BOT_USER"
          git config user.email "$BOT_EMAIL"
          git add apps/web/test/vr/__snapshots__
          if git diff --cached --quiet; then
            echo "No baseline changes to commit."
            exit 0
          fi
          # No [skip ci] — visual-regression must re-run to verify.
          git commit -m "chore(vr): update baselines

          Triggered by @${{ github.event.comment.user.login }} via comment ${{ github.event.comment.html_url }}."
          git push origin "HEAD:${{ steps.pr.outputs.ref }}"

      - name: React success
        if: success()
        uses: actions/github-script@v9.0.0
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'rocket',
            });

      - name: React failure
        if: failure()
        uses: actions/github-script@v9.0.0
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'confused',
            });
