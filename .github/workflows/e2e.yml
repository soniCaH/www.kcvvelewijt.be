name: E2E

# Page-level Playwright smoke suite. PRD: docs/prd/page-level-testing-rework.md
#
# Path filtering uses the same broad globs as ci.yml's `web` filter (#3285):
# apps/web/** and packages/sanity-schemas/**, plus packages/api-contract/**,
# the root manifests, .nvmrc and this file. A hand-listed set of apps/web
# subpaths drifted and let PRs that change the build inputs (next.config.ts,
# vercel.json, the Playwright config's helpers) skip the suite; a glob cannot
# drift. The price is a run on story- or baseline-only changes too — accepted
# by the owner over a narrower list.
#
# PR-only (#3151): E2E used to also run on every push to `main`, but nothing
# ever reads that run — the suite has no `main`-only signal like Codecov's
# trend line, and a red run there just repeats what its PR already caught.
# Filtering is job-level (`changes` below), not on the `on:` triggers — the
# same trap `ci.yml`'s `changes` job avoids: a workflow that never triggers at
# all leaves a required check "Pending" forever, so a docs/API/Studio-only PR
# would never merge. Never move this filter back to `on:` `paths:`.
#
# Cost, stated plainly: branch protection's "require branches to be up to
# date" is off (`.claude/CLAUDE.md` Git Workflow item 7, on wave cost), and
# dropping the `main` push run removes the one signal that would have caught
# two green PRs combining into a red `main` for E2E specifically — the #2874
# class of merge race, this time with nothing watching. The owner accepted
# that trade-off when ruling to drop the trigger rather than keep paying for
# a run nothing read.
on:
  pull_request:
    branches: [main]
    # ready_for_review so marking a draft ready triggers the suite (job is
    # draft-gated below).
    types: [opened, synchronize, reopened, ready_for_review]

# Cancel superseded e2e runs on the same ref — repeated PR pushes shouldn't each
# pay for a full Playwright run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Turbo Remote Cache — see ci.yml for setup. Lets the api-contract/web builds
# below restore from cache when unchanged.
env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  # Same shape and same action as `changes`/`visual-regression-changes` in
  # ci.yml — see the comment on `on:` above for why this lives here and not on
  # the workflow triggers.
  changes:
    name: Detect e2e-relevant changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # paths-filter reads the PR's file list through the REST API, which the
    # action documents as requiring `pull-requests: read`. It survives on
    # `contents: read` alone today only because this repo is public — the
    # listFiles call would 403 the moment it isn't.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      web: ${{ steps.filter.outputs.web }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Detect e2e-relevant paths
        id: filter
        uses: dorny/paths-filter@v4.0.3
        with:
          filters: |
            web:
              - "apps/web/**"
              - "packages/api-contract/**"
              - "packages/sanity-schemas/**"
              - "package.json"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
              - ".nvmrc"
              - ".github/workflows/e2e.yml"

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [changes]
    # This workflow only ever triggers on `pull_request` now (see `on:`
    # above), so `github.event_name != 'pull_request'` can never be true —
    # simplified to the draft guard plus the `changes` output.
    #
    # Known gap, same shape as `ci.yml`'s `quality-checks`: if `changes`
    # itself fails (a `paths-filter` 403/5xx), its output is unset, this `if:`
    # evaluates false, the job is skipped, and GitHub counts a skipped
    # required check as passing — a web PR could merge with E2E never having
    # run. `ci.yml`'s `visual-regression-gate` closes the equivalent hole with
    # a dedicated `if: always()` aggregator job that fails on `changes`'
    # failure; `quality-checks` (E2E's actual peer — one job, not a matrix)
    # has no such aggregator and carries the same gap today. Mirroring
    # `quality-checks` here keeps E2E consistent with the required check it
    # actually resembles, not `visual-regression-gate`'s different shape.
    if: |
      needs.changes.outputs.web == 'true' &&
      github.event.pull_request.draft == false
    environment: Preview
    # Pinned to match @playwright/test in apps/web/package.json (1.60.0) and the
    # local Docker image used by the visual-regression suite. Bump all of these
    # together — drift between the version that runs the suite and the
    # @playwright/test API can produce silent skips or false-positive failures.
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
      options: --user 0:0
    env:
      # The container ships browsers under /ms-playwright. Suppress
      # @playwright/test's postinstall re-download to save ~150 MB and ~1 min.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      # Always staging, never the environment's dataset: the suite's pinned
      # subjects live there, and production carries no event articles
      # (#3087, #3148). Set once for the build and `next start` alike.
      NEXT_PUBLIC_SANITY_DATASET: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.10
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build api-contract
        run: npx turbo build --filter=@kcvv/api-contract

      - name: Build Next.js
        run: npx turbo build --filter=@kcvv/web
        env:
          KCVV_API_URL: ${{ vars.KCVV_API_URL }}
          NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ vars.NEXT_PUBLIC_SANITY_PROJECT_ID }}
          SANITY_API_READ_TOKEN: ${{ secrets.SANITY_API_READ_TOKEN }}

      - name: Run Playwright e2e suite
        run: pnpm --filter @kcvv/web run test:e2e
        env:
          # Same env required at runtime by `next start` for SSR data fetching.
          KCVV_API_URL: ${{ vars.KCVV_API_URL }}
          NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ vars.NEXT_PUBLIC_SANITY_PROJECT_ID }}
          SANITY_API_READ_TOKEN: ${{ secrets.SANITY_API_READ_TOKEN }}

      # Not `failure()`: a flaky test's run concludes SUCCESS, and its failed
      # attempt's trace is exactly the evidence needed to root-cause it
      # (#2971). `!cancelled()` rather than `always()` — this workflow sets
      # `cancel-in-progress`, and a superseded push shouldn't pay to upload
      # half a run. With the `html` reporter now registered this artifact is
      # produced on every CI run, so it uploads every time, not only on red.
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload trace + screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-test-results
          path: apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 14
