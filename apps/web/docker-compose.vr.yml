# Run from apps/web/. Build context is the repo root so the Dockerfile can copy
# workspace manifests for the cached pnpm install layer.
#
# Local prerequisites:
#   1. Docker Desktop running.
#   2. This image already built: `pnpm --filter @kcvv/web run vr:build-image`.
#      `scripts/vr-docker.mjs` fails fast, naming this command, when the image
#      is absent — it never builds the image itself (#3141): a wave builds it
#      once, in step 0, never inside a lane.
#   3. `pnpm build-storybook` has produced apps/web/storybook-static/.
#      (The vr:* scripts in apps/web/package.json chain this via
#      scripts/vr-docker.mjs, which also refuses an unscoped run — #2380.)
services:
  vr:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile.vr
    # Local build-output tag only. Deliberately unversioned — the Playwright
    # version is owned by Dockerfile.vr's FROM, and a second copy here drifts
    # (it read 1.59.1 long after the base moved to 1.60.0).
    image: kcvv-vr-runner:latest
    # CI runs this image on amd64 (ubuntu-latest); unpinned builds on Apple
    # Silicon resolve arm64, which drifts from the committed baselines on
    # display-serif stories (#2370). Emulated amd64 renders byte-identical to
    # CI — scoped runs only; see "The amd64 pin" in docs/agents/testing-ops.md.
    platform: linux/amd64
    init: true
    working_dir: /work/apps/web
    volumes:
      # Test runner config + post-visit hook.
      - ./.storybook:/work/apps/web/.storybook:ro
      # Built Storybook served by http-server inside the container.
      - ./storybook-static:/work/apps/web/storybook-static:ro
      # Read-write mount for baselines and diff artifacts.
      - ./test:/work/apps/web/test
    mem_limit: 8g
    environment:
      - CI=true
      - NODE_OPTIONS=--max-old-space-size=4096
