<!-- Adobe Typekit (Adobe Fonts) for Storybook — Freight Display / Big, Freight
     Sans. Served from a local cache instead of the live use.typekit.net CDN
     (#3137, flake ledger class G): a VR page may not fetch anything off this
     machine, and Typekit's terms forbid self-hosting the CSS/font files
     outright, so `scripts/prefetch-typekit.mjs` fetches them once per
     Storybook build into `.storybook/.typekit-cache/` (gitignored), served
     via `staticDirs` at `/typekit-cache/...` (see main.ts). Synchronous CSS
     embed so the kit's @font-face rules apply before first paint (the async
     JS loader let display text flash the serif fallback). -->
<link rel="stylesheet" href="/typekit-cache/typekit.css" />

<!-- IBM Plex Mono for Storybook (#3030, self-hosted #3137) — `app/layout.tsx`
     self-hosts this via `next/font/google` on `<html>`, which sets
     `--font-ibm-plex-mono`; Storybook never renders that layout, so
     globals.css's `--font-mono` fallback
     (`var(--font-ibm-plex-mono, "IBM Plex Mono"), "Consolas", …`) was
     resolving the LITERAL family name "IBM Plex Mono" against a font nothing
     had loaded, landing on Consolas / Liberation / Courier instead — for
     every mono element on the site, in every VR baseline, since the suite
     has existed. This stylesheet defines the real "IBM Plex Mono"
     @font-face under that exact family name, so the existing fallback
     chain resolves correctly with no globals.css change needed. Same four
     weights `app/layout.tsx` requests (400/500/600/700) — matching them
     here, not just covering them, so a Storybook-only weight can't
     silently diverge from what ships. IBM Plex is OFL-licensed (see
     public/fonts/ibm-plex-mono/OFL.txt) and self-hostable outright, unlike
     Typekit above — committed permanently rather than prefetched per run. -->
<link rel="stylesheet" href="/fonts/ibm-plex-mono/ibm-plex-mono.css" />
