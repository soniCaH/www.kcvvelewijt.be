name = "kcvv-api"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[vars]
PSD_API_BASE_URL = "https://clubapi.prosoccerdata.com"
PSD_IMAGE_BASE_URL = "https://kcvv.prosoccerdata.com"
# FOOTBALISTO_LOGO_CDN_URL: fallback logo source — use RankingVO.clubLogo / Club.logo (direct from PSD) first; fall back to CDN construction when the field is empty
FOOTBALISTO_LOGO_CDN_URL = "https://dfaozfi7c7f3s.cloudfront.net/logos"
# PSD_API_KEY, PSD_API_CLUB, PSD_API_AUTH are secrets — set via wrangler secret put (never in toml)
SANITY_PROJECT_ID = "vhb33jaz"
SANITY_DATASET = "production"
# Mirrors [[vectorize]].index_name below — Wrangler does not expose a
# binding's target index name to the worker at runtime, so the webhook's
# dataset/index guard (src/webhooks/index-handler.ts) reads this var instead
# of trusting the binding to point where this file says it does (#2833).
SEARCH_INDEX_NAME = "kcvv-search"
# SANITY_API_TOKEN is a secret — set via: wrangler secret put SANITY_API_TOKEN
# SANITY_WEBHOOK_SECRET is a secret — set via: wrangler secret put SANITY_WEBHOOK_SECRET
# RESEND_API_KEY is a secret — set via: wrangler secret put RESEND_API_KEY (see docs/prd/email-delivery.md)
# TURNSTILE_SECRET is a secret — set via: wrangler secret put TURNSTILE_SECRET (membership form spam check)

[observability.logs]
enabled = true
invocation_logs = true # captures all console.log / Effect.log output per cron invocation

[triggers]
crons = [
  "0 2 * * *",  # 02:00 UTC — psd-sanity-sync (players, teams, matches)
  "30 2 * * *", # 02:30 UTC — sanity-index-sync (semantic search embeddings)
]

[[kv_namespaces]]
binding = "PSD_CACHE"
id = "82533c23954d4ed98871dd53465c5c0e"
preview_id = "4ee68193dd574f7fa01fba9d53d5d475"

# Global PSD gate — one instance hosts the token bucket + single-flight registry
# shared across all isolates (see src/psd/gate-do.ts, #2328).
[[durable_objects.bindings]]
name = "PSD_GATE"
class_name = "PsdGate"

# SQLite-backed: the only supported DO storage class for new namespaces. PsdGate
# keeps no durable storage (pure in-memory GateLogic), so the backing is moot.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["PsdGate"]

[ai]
binding = "AI"

[[vectorize]]
binding = "SEARCH_INDEX"
index_name = "kcvv-search"

[env.staging]
name = "kcvv-api-staging"

[env.staging.triggers]
crons = [] # no scheduled sync on staging — shares PSD API quota with production

[env.staging.vars]
PSD_API_BASE_URL = "https://clubapi.prosoccerdata.com"
PSD_IMAGE_BASE_URL = "https://kcvv.prosoccerdata.com"
FOOTBALISTO_LOGO_CDN_URL = "https://dfaozfi7c7f3s.cloudfront.net/logos"
SANITY_PROJECT_ID = "vhb33jaz"
SANITY_DATASET = "staging"
CACHE_LONG_TTL = "true"
# Mirrors [[env.staging.vectorize]].index_name below — see the guard note on
# the top-level SEARCH_INDEX_NAME above (#2833).
SEARCH_INDEX_NAME = "kcvv-search-staging"
# SANITY_API_TOKEN is a secret — set via: wrangler secret put SANITY_API_TOKEN --env staging
# SANITY_WEBHOOK_SECRET is a secret — set via: wrangler secret put SANITY_WEBHOOK_SECRET --env staging
# RESEND_API_KEY is a secret — set via: wrangler secret put RESEND_API_KEY --env staging (see docs/prd/email-delivery.md)
# TURNSTILE_SECRET is a secret — set via: wrangler secret put TURNSTILE_SECRET --env staging (membership form spam check)

[[env.staging.kv_namespaces]]
binding = "PSD_CACHE"
id = "4ee68193dd574f7fa01fba9d53d5d475"

# Named envs don't inherit top-level DO bindings — redeclare for staging.
# Migrations ([[migrations]]) are defined once at the top level and apply here too.
[[env.staging.durable_objects.bindings]]
name = "PSD_GATE"
class_name = "PsdGate"

[env.staging.ai]
binding = "AI"

[[env.staging.vectorize]]
binding = "SEARCH_INDEX"
# Separate index from production. The "no cron" argument this used to carry
# never covered the webhook: /webhooks/index is routed unconditionally in
# src/index.ts, both deployments run the same `main`, and the staging worker
# serves it — so a staging Sanity edit could silently overwrite (or add junk
# to) the production vector for the same document id. See #2833.
index_name = "kcvv-search-staging"
